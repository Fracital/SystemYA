# Keep STomp (@sysce/stomp) and the powerMouse UI (the vendor/powermouse submodule) current.
#
# powerMouse (Fracital/powerMouse) publishes master as @sysce/stomp@nightly at 07:17 UTC, and on a
# manual run, and only a commit whose CI passed (its nightly.yml). Right after it publishes, its
# nightly.yml sends this repository a repository_dispatch, type stomp-nightly, with the version in
# client_payload.version, so the update starts within minutes. Every hour the schedule checks too,
# for a lost dispatch (and while powerMouse sends none).
# Both move the package to the newest nightly and the submodule to the commit it was built from
# (the package's gitHead), so the UI and the runtime it drives come from one tested commit. The
# package only moves to a version published after the pinned one, and the submodule only forward
# along master. A manual run may name any version, and with dry_run it only tests.
#
# The probe job reads the pin and npm and stops there when both are current (a few seconds, no
# install). The check job holds no write token. It bumps, then runs what CI and the deploy run
# (npm ci, npm run verify, npm run build, verify-static-dist.mjs with the neutrality check, the
# deploy contract) and scripts/stomp-smoke.mjs, which starts STomp from dist/ in headless Chrome and
# opens a page through the public relay. When it passes, the publish job commits the change as
# github-actions[bot] straight to main, starts deploy.yml (a push made with GITHUB_TOKEN starts no
# workflow, a workflow_dispatch does) and waits for that deploy to pass. When main moved during the
# check, nothing is pushed: the publish job starts this workflow again, which tests the update on
# top of the new main. When the check or the deploy fails, the report job opens an issue, or
# comments on the open one, with the error lines; main keeps its pin. A later update that passes,
# or an hourly probe that finds main current and deployed, closes the issue.

name: STomp update

on:
  repository_dispatch:
    types: [stomp-nightly]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "A @sysce/stomp version to try instead of the nightly tag (empty: the nightly tag)"
        required: false
        default: ""
      dry_run:
        description: "Only test: run every check (on the pin when it is current), push nothing, open no issue"
        type: boolean
        required: false
        default: false
      retry:
        description: "Set by this workflow when main moved during a run (how many times it retried)"
        required: false
        default: "0"

# one update at a time: a newer run waits for the one in flight, and replaces a run already waiting
# (both read the nightly tag, which only moves forward)
concurrency:
  group: stomp-update
  cancel-in-progress: false

permissions:
  contents: read

# bash with pipefail, so a check piped into tee still fails its step
defaults:
  run:
    shell: bash

env:
  ISSUE_TITLE: STomp update needs attention
  PACKAGE_NAME: "@sysce/stomp"
  SUBMODULE: vendor/powermouse
  UPSTREAM: Fracital/powerMouse
  PLAYWRIGHT_CORE_VERSION: 1.65.0
  # how long a dispatched version may take to appear on the registry
  NPM_WAIT_SECONDS: "1200"
  # a pair that failed is tested again by the schedule after this long (a new nightly at once)
  RETEST_FAILED_HOURS: "6"
  MAX_RETRIES: "3"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      update: ${{ steps.want.outputs.update }}
      package: ${{ steps.want.outputs.package }}
      submodule: ${{ steps.want.outputs.submodule }}
      current: ${{ steps.want.outputs.current }}
      version: ${{ steps.want.outputs.version }}
      commit: ${{ steps.want.outputs.commit }}
      pinned: ${{ steps.want.outputs.pinned }}
      base: ${{ steps.want.outputs.base }}
      requested: ${{ steps.want.outputs.requested }}
      dry_run: ${{ steps.want.outputs.dry_run }}
      retry: ${{ steps.want.outputs.retry }}
    steps:
      # package.json and the gitlink are all the probe reads
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Newest nightly
        id: want
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
          DISPATCHED: ${{ github.event.client_payload.version }}
          DRY_RUN_INPUT: ${{ inputs.dry_run == true }}
          RETRY: ${{ inputs.retry }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          # npm view, with a few tries for a registry hiccup
          view() {
            local n
            for n in 1 2 3 4; do
              npm view --prefer-online "$@" 2>"$RUNNER_TEMP/npm.err" && return 0
              grep -q E404 "$RUNNER_TEMP/npm.err" && return 1
              sleep $((n * 10))
            done
            cat "$RUNNER_TEMP/npm.err" >&2
            return 1
          }
          # a version announced right after it was published can take minutes to reach the registry
          wait_for() {
            local deadline=$((SECONDS + NPM_WAIT_SECONDS))
            until [[ $(view "$PACKAGE_NAME@$1" version 2>/dev/null) == "$1" ]]; do
              if ((SECONDS >= deadline)); then
                echo "::error::npm still has no $PACKAGE_NAME@$1 after ${NPM_WAIT_SECONDS}s"
                return 1
              fi
              echo "waiting for npm to serve $PACKAGE_NAME@$1"
              sleep 15
            done
          }
          published() { node -e 'const t = require(process.argv[1]); console.log(Date.parse(t[process.argv[2]] ?? 0) || 0)' "$RUNNER_TEMP/times.json" "$1"; }

          current=$(node -p 'require("./package.json").dependencies[process.env.PACKAGE_NAME]')
          pinned=$(git ls-tree HEAD "$SUBMODULE" | awk '$2 == "commit" { print $3 }')
          dry_run=false
          [[ $EVENT == workflow_dispatch && $DRY_RUN_INPUT == true ]] && dry_run=true
          [[ $RETRY =~ ^[0-9]+$ ]] || RETRY=0
          if [[ -n $REQUESTED ]]; then
            [[ $REQUESTED =~ $semver ]] || { echo "::error::not a version: $REQUESTED"; exit 1; }
            wait_for "$REQUESTED"
            version=$REQUESTED
          else
            if [[ -n $DISPATCHED ]]; then
              [[ $DISPATCHED =~ $semver ]] || { echo "::error::the dispatch names no version: $DISPATCHED"; exit 1; }
              wait_for "$DISPATCHED"
            fi
            nightly=$(view "$PACKAGE_NAME@nightly" version)
            view "$PACKAGE_NAME" time --json >"$RUNNER_TEMP/times.json"
            version=$nightly
            # the dispatched version, unless the tag already names a newer one
            if [[ -n $DISPATCHED ]] && (($(published "$DISPATCHED") > $(published "$nightly"))); then
              version=$DISPATCHED
            fi
          fi
          commit=$(view "$PACKAGE_NAME@$version" gitHead)
          package=false
          move_sub=false
          if [[ $version != "$current" ]]; then
            package=true
            # never go back: the candidate must have been published after the pin
            # (a manual run may name any version)
            if [[ -z $REQUESTED ]] && (($(published "$version") <= $(published "$current"))); then
              echo "::warning::npm names $version, published before the pinned $current; not updating"
              package=false
            fi
          fi
          if [[ -n $pinned && -n $commit && $pinned != "$commit" ]]; then
            # forward only: the nightly's commit must be ahead of the pinned one on master
            status=$(gh api "repos/$UPSTREAM/compare/$pinned...$commit" --jq .status)
            if [[ $status == ahead || -n $REQUESTED ]]; then
              move_sub=true
            else
              echo "::notice::$SUBMODULE stays at $pinned: the nightly's $commit is not ahead of it ($status)"
            fi
          fi
          {
            echo "current=$current"
            echo "version=$version"
            echo "commit=$commit"
            echo "pinned=$pinned"
            echo "package=$package"
            echo "submodule=$move_sub"
            echo "base=$(git rev-parse HEAD)"
            echo "requested=$REQUESTED"
            echo "dry_run=$dry_run"
            echo "retry=$RETRY"
          } >>"$GITHUB_OUTPUT"

          issue=$(gh issue list --state open --author app/github-actions --json number,title,updatedAt \
            --jq 'map(select(.title == env.ISSUE_TITLE))[0] // empty')
          if [[ $package == false && $move_sub == false && $dry_run == true ]]; then
            # a dry run of the pin itself: the whole check, nothing bumped
            echo "::notice::$PACKAGE_NAME $current and $SUBMODULE ${pinned:-(none)} are current; dry run of the pin"
            echo update=true >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $package == false && $move_sub == false ]]; then
            echo "::notice::$PACKAGE_NAME $current and $SUBMODULE ${pinned:-(none)} are current"
            echo update=false >>"$GITHUB_OUTPUT"
            # main is current; once its last deploy passed, nothing is left for the issue to report
            if [[ -n $issue && $dry_run == false ]]; then
              n=$(jq -r .number <<<"$issue")
              read -r conclusion sha < <(gh run list --workflow deploy.yml --branch main --status completed -L 1 \
                --json conclusion,headSha --jq '.[0] | "\(.conclusion) \(.headSha)"')
              if [[ $conclusion == success ]]; then
                gh issue close "$n" --comment "main has \`$PACKAGE_NAME@$current\` and $SUBMODULE ${pinned:-(none)}, the newest nightly, and its last deploy (${sha:0:7}) passed."
              fi
            fi
            exit 0
          fi
          # the schedule does not retest a pair that just failed; a new nightly, a dispatch or a
          # manual run tests at once
          if [[ $EVENT == schedule && -n $issue ]]; then
            n=$(jq -r .number <<<"$issue")
            updated=$(date -d "$(jq -r .updatedAt <<<"$issue")" +%s)
            text=$(gh issue view "$n" --json body,comments --jq '[.body, .comments[].body] | join("\n")')
            if grep -qF "<!-- stomp-update-failed: $version $commit -->" <<<"$text" &&
              (($(date +%s) - updated < RETEST_FAILED_HOURS * 3600)); then
              echo "::notice::$version ($commit) failed less than ${RETEST_FAILED_HOURS}h ago (#$n); the schedule tries it again later"
              echo update=false >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "::notice::$PACKAGE_NAME $current -> $version ($package), $SUBMODULE ${pinned:-(none)} -> $commit ($move_sub)$([[ $dry_run == true ]] && echo ', dry run')"
          echo update=true >>"$GITHUB_OUTPUT"

  check:
    needs: probe
    if: needs.probe.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      error: ${{ steps.explain.outputs.error }}
    env:
      BASE: ${{ needs.probe.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.probe.outputs.base }}
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Retry helper
        run: |
          # registry and network steps get four tries: a tarball can 404 for a while after publish
          cat >"$RUNNER_TEMP/retry.sh" <<'EOF'
          retry() {
            local n
            for n in 1 2 3 4; do
              "$@" && return 0
              ((n < 4)) || break
              echo "::warning::try $n of 4 failed: $*; again in $((n * 30))s"
              sleep $((n * 30))
            done
            return 1
          }
          EOF

      - name: Bump
        env:
          PACKAGE: ${{ needs.probe.outputs.package }}
          MOVE_SUBMODULE: ${{ needs.probe.outputs.submodule }}
          VERSION: ${{ needs.probe.outputs.version }}
          COMMIT: ${{ needs.probe.outputs.commit }}
        run: |
          . "$RUNNER_TEMP/retry.sh"
          mkdir -p "$RUNNER_TEMP/bump"
          if [[ $PACKAGE == true ]]; then
            retry npm install --prefer-online --save-exact "$PACKAGE_NAME@$VERSION" 2>&1 | tee -a "$RUNNER_TEMP/gate.log"
            test "$(node -p 'require("./package.json").dependencies[process.env.PACKAGE_NAME]')" = "$VERSION"
            cp package.json package-lock.json "$RUNNER_TEMP/bump/"
          fi
          if [[ $MOVE_SUBMODULE == true ]]; then
            retry git -C "$SUBMODULE" fetch --depth 1 origin "$COMMIT"
            git -C "$SUBMODULE" checkout -q --detach "$COMMIT"
            echo "$COMMIT" >"$RUNNER_TEMP/bump/submodule"
          fi

      - name: Only the pin changed
        run: |
          changed=$(git status --porcelain | awk '{ print $2 }' | sort | tr '\n' ' ')
          for path in $changed; do
            case $path in
              package.json | package-lock.json | "$SUBMODULE") ;;
              *) echo "::error::the bump changed $path" | tee -a "$RUNNER_TEMP/gate.log"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        if: needs.probe.outputs.dry_run != 'true'
        with:
          name: stomp-bump
          path: ${{ runner.temp }}/bump/
          retention-days: 7
          if-no-files-found: error

      # what ci.yml and deploy.yml run
      - name: Install dependencies
        run: |
          . "$RUNNER_TEMP/retry.sh"
          retry npm ci 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      - name: Verify source and history
        run: npm run verify 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      # prepare:stomp (the patches and the stamped names), astro check, astro build and
      # verify-static-dist.mjs (the neutrality check)
      - name: Build the static Astro SPA
        run: npm run build 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      - name: Check deploy contract
        run: |
          {
            test -f dist/index.html
            node scripts/verify-static-dist.mjs
            if [[ -n $(find dist -maxdepth 1 \( -name room -o -name v1 -o -name cdn -o -name api \)) ]]; then
              echo "::error::dist/ has a reserved edge path"
              exit 1
            fi
          } 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      - name: STomp opens a page from dist/
        run: |
          . "$RUNNER_TEMP/retry.sh"
          retry npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock "playwright-core@$PLAYWRIGHT_CORE_VERSION"
          PLAYWRIGHT_CORE="$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs" node scripts/stomp-smoke.mjs 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      # the build writes only ignored files; SystemYA's own settings (webTransport and the rest of
      # stomp-config.json) are never the updater's to change
      - name: The build left the source alone
        run: |
          git diff --exit-code "$BASE" -- src/systemya/stomp-config.json
          changed=$(git status --porcelain | awk '{ print $2 }' | sort | tr '\n' ' ')
          for path in $changed; do
            case $path in
              package.json | package-lock.json | "$SUBMODULE") ;;
              *) echo "::error::the check changed $path" | tee -a "$RUNNER_TEMP/gate.log"; exit 1 ;;
            esac
          done

      # the lines the issue quotes: test failures, thrown errors (a patch that no longer matches
      # names its file and patch) and npm errors
      - name: Explain the failure
        id: explain
        if: failure()
        run: |
          [[ -f $RUNNER_TEMP/gate.log ]] || exit 0
          # shellcheck disable=SC2016 # the backticks are literal
          # each matching line, and the indented lines under it (without stack frames)
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/gate.log" |
            awk '!/^[ \t]*✔/ && /✖|Error:|^error|::error::|npm error|ERR!|expected .* found it|not served|does not name|changed \(new:|named after it|has the title| says / { print; under = 8; next }
              under > 0 && /^[ \t]/ && !/^[ \t]+at / { print; under--; next }
              { under = 0 }' |
            cut -c 1-400 | awk '!seen[$0]++' | head -n 60 | sed 's/```/` ` `/g' >"$RUNNER_TEMP/error.txt" || true
          {
            echo "error<<STOMP_UPDATE_EOF"
            cat "$RUNNER_TEMP/error.txt"
            echo "STOMP_UPDATE_EOF"
          } >>"$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # the backticks are literal
          printf '### The update failed\n\n```text\n%s\n```\n' "$(cat "$RUNNER_TEMP/error.txt")" >>"$GITHUB_STEP_SUMMARY"

  publish:
    needs: [probe, check]
    if: needs.probe.outputs.update == 'true' && needs.probe.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
      issues: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.push.outputs.sha }}
      deploy: ${{ steps.deploy.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CURRENT: ${{ needs.probe.outputs.current }}
      VERSION: ${{ needs.probe.outputs.version }}
      COMMIT: ${{ needs.probe.outputs.commit }}
      PINNED: ${{ needs.probe.outputs.pinned }}
      BASE: ${{ needs.probe.outputs.base }}
      REQUESTED: ${{ needs.probe.outputs.requested }}
      RETRY: ${{ needs.probe.outputs.retry }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.probe.outputs.base }}

      - uses: actions/download-artifact@v4
        with:
          name: stomp-bump
          path: ${{ runner.temp }}/bump/

      - name: Commit and push to main
        id: push
        run: |
          subject=()
          detail=()
          if [[ -f $RUNNER_TEMP/bump/package.json ]]; then
            cp "$RUNNER_TEMP/bump/package.json" "$RUNNER_TEMP/bump/package-lock.json" .
            git add package.json package-lock.json
            subject+=("STomp to $VERSION")
            detail+=("$PACKAGE_NAME $CURRENT -> $VERSION.")
          fi
          if [[ -f $RUNNER_TEMP/bump/submodule ]]; then
            sha=$(cat "$RUNNER_TEMP/bump/submodule")
            # the gitlink alone; the submodule's files are not needed to move it
            git update-index --cacheinfo "160000,$sha,$SUBMODULE"
            subject+=("the powerMouse UI to ${sha:0:7}")
            detail+=("$SUBMODULE $PINNED -> $sha.")
          fi
          changed=$(git diff --cached --name-only | sort | tr '\n' ' ')
          for path in $changed; do
            case $path in
              package.json | package-lock.json | "$SUBMODULE") ;;
              *) echo "::error::unexpected change: $path"; exit 1 ;;
            esac
          done
          if [[ -z $changed ]]; then
            echo "::error::nothing to commit"
            exit 1
          fi
          if (( ${#subject[@]} == 2 )); then title="Update ${subject[0]} and ${subject[1]}"; else title="Update ${subject[0]}"; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --no-verify -m "$title" -m "${detail[*]} Built from $UPSTREAM@$COMMIT."
          # main must still be the commit the check tested on; a push can also lose that race
          git fetch --no-tags origin main
          if [[ $(git rev-parse FETCH_HEAD) == "$BASE" ]] && git push origin HEAD:main; then
            echo pushed=true >>"$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
            echo "::notice::pushed $(git rev-parse HEAD) to main"
            exit 0
          fi
          echo pushed=false >>"$GITHUB_OUTPUT"
          # test the update again on top of the new main: a fresh run bumps from there
          if ((RETRY < MAX_RETRIES)); then
            gh workflow run stomp-update.yml --ref main -f version="$REQUESTED" -f retry=$((RETRY + 1))
            echo "::notice::main moved while the update was checked; nothing pushed, started a new run on the new main (retry $((RETRY + 1)) of $MAX_RETRIES)"
          else
            echo "::warning::main moved while the update was checked, $MAX_RETRIES retries in a row; nothing pushed, the schedule tries again"
          fi

      - name: Deploy
        id: deploy
        if: steps.push.outputs.pushed == 'true'
        env:
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          # the deploy runs this workflow started; find ours by its id not being there before
          ids() { gh run list --workflow deploy.yml --event workflow_dispatch -L 20 --json databaseId --jq '.[].databaseId' | sort; }
          ids >"$RUNNER_TEMP/before"
          gh workflow run deploy.yml --ref main
          run=
          for _ in $(seq 1 24); do
            sleep 5
            run=$(ids | comm -13 "$RUNNER_TEMP/before" - | head -n 1) || true
            [[ -n $run ]] && break
          done
          if [[ -z $run ]]; then
            echo "::error::deploy.yml was dispatched but no run appeared"
            exit 1
          fi
          url=$(gh run view "$run" --json url --jq .url)
          head=$(gh run view "$run" --json headSha --jq .headSha)
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "::notice::deploy of ${head:0:7}: $url"
          # main may have moved again since the push; the deploy must still contain the update
          status=$(gh api "repos/$GH_REPO/compare/$SHA...$head" --jq .status)
          if [[ $status != identical && $status != ahead ]]; then
            echo "::error::the deploy runs $head, which does not contain $SHA ($status)"
            exit 1
          fi
          gh run watch "$run" --exit-status --interval 20 >/dev/null || {
            echo "::error::the deploy of $SHA failed: $url"
            exit 1
          }
          echo "::notice::deployed $SHA"

      - name: Close the failure issue
        if: steps.push.outputs.pushed == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          n=$(gh issue list --state open --author app/github-actions --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE))[0].number // empty')
          if [[ -n $n ]]; then
            gh issue close "$n" --comment "Updated to \`$VERSION\` ($UPSTREAM@$COMMIT) in $(git rev-parse HEAD) and deployed: $URL"
          fi

  report:
    needs: [probe, check, publish]
    if: >-
      always() && needs.probe.outputs.update == 'true' && needs.probe.outputs.dry_run != 'true' &&
      (needs.check.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CURRENT: ${{ needs.probe.outputs.current }}
      VERSION: ${{ needs.probe.outputs.version }}
      COMMIT: ${{ needs.probe.outputs.commit }}
      PINNED: ${{ needs.probe.outputs.pinned }}
      PUSHED: ${{ needs.publish.outputs.pushed }}
      SHA: ${{ needs.publish.outputs.sha }}
      DEPLOY: ${{ needs.publish.outputs.deploy }}
      ERROR: ${{ needs.check.outputs.error }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the issue
        run: |
          # shellcheck disable=SC2016 # the single-quoted $ are jq's
          steps=$(gh run view "$GITHUB_RUN_ID" --json jobs \
            --jq '[.jobs[] | .name as $j | .steps[] | select(.conclusion == "failure") | "\($j): \(.name)"] | join(", ")')
          if [[ $PUSHED == true ]]; then
            marker="<!-- stomp-update-deploy-failed: $SHA -->"
            body=$(printf '%s\n\n%s\n\n%s\n' \
              "main has \`$PACKAGE_NAME@$VERSION\` and $SUBMODULE $COMMIT in $SHA, but its deploy did not pass: ${DEPLOY:-no deploy run was found}." \
              "Failed: ${steps:-see the run}. Run: $RUN_URL. Run the Deploy workflow again once the cause is fixed." \
              "$marker")
          else
            marker="<!-- stomp-update-failed: $VERSION $COMMIT -->"
            error=
            # shellcheck disable=SC2016 # the backticks are literal
            [[ -n $ERROR ]] && error=$(printf '```text\n%s\n```' "$ERROR")
            body=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n' \
              "Updating to \`$PACKAGE_NAME@$VERSION\` and $SUBMODULE $COMMIT ($UPSTREAM) failed, so main still has \`$CURRENT\` and ${PINNED:-no submodule}." \
              "Failed: ${steps:-see the run}. Run: $RUN_URL" \
              "${error:-No error lines were captured; see the run.}" \
              "To reproduce: \`npm install $PACKAGE_NAME@$VERSION --save-exact\`, \`git -C $SUBMODULE fetch origin $COMMIT && git -C $SUBMODULE checkout $COMMIT\`, then \`npm run verify\`, \`npm run build\` and \`node scripts/stomp-smoke.mjs\`." \
              "$marker")
          fi
          n=$(gh issue list --state open --author app/github-actions --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE))[0].number // empty')
          if [[ -z $n ]]; then
            gh issue create --title "$ISSUE_TITLE" --body "$body"
            exit 0
          fi
          text=$(gh issue view "$n" --json body,comments --jq '[.body, .comments[].body] | join("\n")')
          if ! grep -qF "$marker" <<<"$text"; then
            gh issue comment "$n" --body "$body"
          else
            # the schedule retests a failed pair every few hours; say it still fails
            gh issue comment "$n" --body "Still failing: $RUN_URL (${steps:-see the run})."
          fi
