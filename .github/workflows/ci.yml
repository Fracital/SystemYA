name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, stomp-signal] # stomp-signal only starts stomp-update.yml

permissions:
  contents: read

jobs:
  verify:
    # divide's untrusted CI pool (CT 208): public internet only, no secrets
    runs-on: [divide, ci]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: node scripts/verify-static-dist.mjs
